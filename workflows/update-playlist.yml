name: Update Playlist

# 定时更新影视源：抓取 -> 去重聚合 -> 提交回仓库
# cron 使用 UTC 时间（北京时间需减 8 小时）
on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 次日 06:00
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:        # 也支持在 Actions 页面手动点一下立即运行

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成播放列表
        run: |
          python3 scripts/update_playlist.py \
            --sources playlist/sources.txt \
            --out-dir playlist \
            --max-per-channel 3

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist/all.m3u playlist/meta.json
          if git diff --cached --quiet; then
            echo "播放列表没有变化，跳过提交。"
          else
            git commit -m "chore: 自动更新播放列表 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
