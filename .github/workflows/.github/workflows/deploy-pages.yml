name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置Pages
        uses: actions/configure-pages@v4
      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 部署上线
        id: deployment
        uses: actions/deploy-pages@v4
