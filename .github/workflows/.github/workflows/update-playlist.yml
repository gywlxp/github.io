name: Update Playlist
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'playlist/sources.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行聚合脚本
        run: |
          python scripts/update_playlist.py --input playlist/sources.txt --output playlist/all.m3u --meta playlist/meta.json --max-per-channel 3
      - name: 提交更新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist/all.m3u playlist/meta.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "自动更新影视源 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
