name: Update Playlist
on:
  push:
    branches: [main]
    paths:
      - 'playlist/sources.txt'
      - 'scripts/update_playlist.py'
  workflow_dispatch:
  schedule:
    - cron: '0 22,10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run aggregator
        run: python scripts/update_playlist.py --input playlist/sources.txt --output playlist/all.m3u --meta playlist/meta.json --max-per-channel 3
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist/all.m3u playlist/meta.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "Auto update playlist $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
