name: Update Playlist

# 定时刷新播放列表（原地刷新模式）：
#   以你自己维护的频道列表 playlist/all.m3u 为准，
#   只刷新每个频道的直播线路：
#     · 原有线路仍然可用的，原样保留、绝不替换；
#     · 原有线路失效的，才用源里最新的可用线路补位；
#     · 频道名、分组名、排列顺序一律保持不变，列表结构不会被打乱；
#     · 某频道线路全失效且源里也没有替代时，保留其原有线路，频道不会消失。
#   结果仍写回 playlist/all.m3u（订阅地址不变），清单里的频道集合不会增减。
#   → 想增删频道 / 改分组名，就手动编辑 playlist/all.m3u 后提交。
# cron 使用 UTC 时间（北京时间需减 8 小时）
on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 次日 06:00
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:        # 也支持在 Actions 页面手动点一下立即运行

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 按清单原地刷新播放线路
        run: |
          python3 scripts/update_playlist.py \
            --sources playlist/sources.txt \
            --baseline playlist/all.m3u \
            --probe \
            --out-dir playlist \
            --max-per-channel 3

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist/all.m3u playlist/meta.json
          if git diff --cached --quiet; then
            echo "播放列表没有变化，跳过提交。"
          else
            git commit -m "chore: 刷新播放线路 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
